name: Release

# Push a tag "vX.Y.Z" (matching <Version> in Directory.Build.props) to build and publish a release with the
# two setups and SHA256SUMS.txt. The apps update themselves from the latest of these releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check the tag matches the version
        shell: powershell
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in Directory.Build.props."
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Packaging tests (Pester)
        shell: powershell
        run: |
          Import-Module Pester -MaximumVersion 4.99 -Force
          $result = Invoke-Pester tests/packaging -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

      # Runs the .NET tests, publishes the executables and builds both setups and SHA256SUMS.txt.
      - name: Build the release
        shell: powershell
        run: .\scripts\build-release.ps1

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: WRApperture ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/WRApperture-Client-Setup-*.exe
            dist/WRApperture-Host-Setup-*.exe
            dist/SHA256SUMS.txt
